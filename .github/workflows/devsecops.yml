name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  sast-sca:
    name: SAST / SCA (Trivy filesystem)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: sarif
          output: trivy-fs.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  iac-scan:
    name: IaC Scanning (Checkov)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: Checkov IaC Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile,kubernetes
          soft_fail: false
          output_format: sarif
          output_file_path: checkov.sarif

  build-and-scan:
    name: Build and Container Image Scan
    runs-on: ubuntu-latest
    needs: [sast-sca, iac-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build hardened webapp image
        run: docker build -t container-security-webapp:${{ github.sha }} ./webapp
      - name: Build hardened mariadb image
        run: docker build -t container-security-mariadb:${{ github.sha }} ./mariadb
      - name: Trivy image scan — webapp
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: container-security-webapp:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Trivy image scan — mariadb
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: container-security-mariadb:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1