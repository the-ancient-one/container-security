name: DevSecOps                         

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read
      
jobs:

  # ──────────────────────────────────────────────────────────────
  # JOB 1: Secrets Scanning
  # Scans git history diff for leaked credentials/tokens
  # ──────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                  

      # Pull Request — scan only the PR diff
      - name: TruffleHog Secrets Scan (Pull Request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}   # target branch tip
          head: ${{ github.event.pull_request.head.sha }}   # PR branch tip
          extra_args: --only-verified                        # reduces false positives

      # Push — scan only the commits in this push
      - name: TruffleHog Secrets Scan (Push)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # github.event.before = commit SHA before the push
          # falls back to default branch if this is the first push (all-zeros SHA)
          base: ${{ github.event.before == '0000000000000000000000000000000000000000' && github.event.repository.default_branch || github.event.before }}
          head: ${{ github.event.after }}                    
          extra_args: --only-verified

  # ──────────────────────────────────────────────────────────────
  # JOB 2: SAST / SCA — Trivy filesystem scan
  # Scans source code and dependencies for known CVEs
  # Runs in parallel with iac-scan, both need secrets-scan to pass
  # ──────────────────────────────────────────────────────────────
  sast-sca:
    name: SAST / SCA (Trivy filesystem)
    runs-on: ubuntu-latest
    needs: secrets-scan                  
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true          
        id: trivy-fs
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

      - name: Fail if vulnerabilities found
        if: steps.trivy-fs.outcome == 'failure'
        run: exit 1

  # ──────────────────────────────────────────────────────────────
  # JOB 3: IaC Scanning — Checkov
  # Scans Dockerfiles and Kubernetes manifests for misconfigurations
  # Runs in parallel with sast-sca
  # ──────────────────────────────────────────────────────────────
  iac-scan:
    name: IaC Scanning (Checkov)
    runs-on: ubuntu-latest
    needs: secrets-scan                  
    steps:
      - uses: actions/checkout@v4

      - name: Checkov IaC Scan
        uses: bridgecrewio/checkov-action@master
        continue-on-error: true           
        id: checkov
        with:
          directory: .
          framework: dockerfile,kubernetes
          soft_fail: false
          output_format: sarif
          output_file_path: checkov.sarif

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif

      - name: Fail if IaC issues found
        if: steps.checkov.outcome == 'failure'
        run: echo "Failed"

  # ──────────────────────────────────────────────────────────────
  # JOB 4: Build and Container Image Scan
  # Builds both Docker images then scans each with Trivy
  # Only runs after BOTH sast-sca and iac-scan pass
  # ──────────────────────────────────────────────────────────────
  build-and-scan:
    name: Build and Container Image Scan
    runs-on: ubuntu-latest
    needs: [sast-sca, iac-scan]           

    steps:
      - uses: actions/checkout@v4

      - name: Build hardened webapp image
        run: docker build -t container-security-webapp:${{ github.sha }} ./webserver

      - name: Build hardened mariadb image
        run: docker build -t container-security-mariadb:${{ github.sha }} ./dbserver

      # ── Webapp image scan ──────────────────────────────────────
      - name: Trivy image scan — webapp
        uses: aquasecurity/trivy-action@master
        continue-on-error: true           
        id: trivy-webapp
        with:
          image-ref: container-security-webapp:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: sarif
          output: trivy-webapp.sarif

      - name: Upload webapp image scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-webapp.sarif

      # ── MariaDB image scan ─────────────────────────────────────
      - name: Trivy image scan — mariadb
        uses: aquasecurity/trivy-action@master
        continue-on-error: true          
        id: trivy-mariadb
        with:
          image-ref: container-security-mariadb:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: sarif
          output: trivy-mariadb.sarif

      - name: Upload mariadb image scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-mariadb.sarif

      - name: Fail if image vulnerabilities found
        if: steps.trivy-webapp.outcome == 'failure' || steps.trivy-mariadb.outcome == 'failure'
        run: echo "Failed"