apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose --file docker-compose.yml convert
    kompose.version: 1.30.0 (HEAD)
  labels:
    io.kompose.service: csvs-webserver
  name: csvs-webserver
  namespace: csvs
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: csvs-webserver
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0        # never create new pod before old is gone (prevents hostPort conflict)
      maxUnavailable: 1  # kill old pod first, then start new
  template:
    metadata:
      annotations:
        kompose.cmd: kompose --file docker-compose.yml convert
        kompose.version: 1.30.0 (HEAD)
      labels:
        io.kompose.network/helm-chart-csvs-dbserver-net: "true"
        io.kompose.service: csvs-webserver
    spec:
      containers:
        - name: u123456-csvs-webserver-c
          image: u123456_csvs_webserver_i:1.5
          imagePullPolicy: Never
          ports:
            - containerPort: 80         # NO hostPort — NodePort service handles external access
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: "104857600"
          volumeMounts:
            - name: db-password
              mountPath: /run/secrets/db_password   # exact file path PHP reads
              subPath: db_password                   # mounts ONE file, not the whole directory
              readOnly: true                         # only the file is read-only, not /run/secrets
      hostname: wwwcyber23test
      restartPolicy: Always
      volumes:
        - name: db-password
          secret:
            secretName: db-password     # K8s secret name
            items:
              - key: db-password        # ← hyphen: matches actual key inside the K8s secret
                path: db_password       # ← underscore: PHP reads /run/secrets/db_password
